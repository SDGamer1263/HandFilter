name: Build macOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          brew install create-dmg imagemagick

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Sync version
        run: python scripts/sync-version.py

      - name: Build with PyInstaller
        run: pyinstaller -y main_macos.spec

      - name: Build DMG
        run: |
          chmod +x packaging/macos/build-dmg.sh
          ./packaging/macos/build-dmg.sh

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: HandFilter-macOS-App
          path: dist/HandFilter.app
          retention-days: 30

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: HandFilter-macOS-DMG
          path: dist/HandFilter-*-macOS-arm64.dmg
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Windows portable artifact
        uses: actions/download-artifact@v4
        with:
          name: HandFilter-Windows-Portable
          path: artifacts/windows-portable
        continue-on-error: true

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: HandFilter-Windows-Setup
          path: artifacts/windows-installer
        continue-on-error: true

      - name: Download Linux AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: HandFilter-Linux-AppImage
          path: artifacts/linux-appimage
        continue-on-error: true

      - name: Download Linux portable artifact
        uses: actions/download-artifact@v4
        with:
          name: HandFilter-Linux-Portable
          path: artifacts/linux-portable
        continue-on-error: true

      - name: Download macOS .app artifact
        uses: actions/download-artifact@v4
        with:
          name: HandFilter-macOS-App
          path: artifacts/macos-app
        continue-on-error: true

      - name: Download macOS DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: HandFilter-macOS-DMG
          path: artifacts/macos-dmg
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/windows-portable/*.zip
            artifacts/windows-installer/*.exe
            artifacts/linux-appimage/*.AppImage
            artifacts/linux-portable/*.tar.gz
            artifacts/macos-app/HandFilter.app
            artifacts/macos-dmg/*.dmg
          generate_release_notes: true