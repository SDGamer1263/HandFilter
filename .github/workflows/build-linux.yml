name: Build Linux Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk python3-venv python3-pip \
              libglib2.0-0 libgl1 libegl1 libx11-6 libxext6 libxrender1 \
               libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
                  patchelf desktop-file-utils
      - name: Install AppImageTool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Sync version
        run: python scripts/sync-version.py

      - name: Build with PyInstaller
        run: pyinstaller -y main_linux.spec

      - name: Build AppImage
        run: |
          chmod +x packaging/linux/build-appimage.sh
          ./packaging/linux/build-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: HandFilter-Linux-AppImage
          path: dist/HandFilter-*-Linux-x86_64.AppImage
          retention-days: 30

      - name: Upload portable tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: HandFilter-Linux-Portable
          path: dist/HandFilter-*-Linux-Portable.tar.gz
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Windows portable artifact
        uses: actions/download-artifact@v4
        with:
          name: HandFilter-Windows-Portable
          path: artifacts/windows-portable
        continue-on-error: true

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: HandFilter-Windows-Setup
          path: artifacts/windows-installer
        continue-on-error: true

      - name: Download Linux AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: HandFilter-Linux-AppImage
          path: artifacts/linux-appimage

      - name: Download Linux portable artifact
        uses: actions/download-artifact@v4
        with:
          name: HandFilter-Linux-Portable
          path: artifacts/linux-portable

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/windows-portable/*.zip
            artifacts/windows-installer/*.exe
            artifacts/linux-appimage/*.AppImage
            artifacts/linux-portable/*.tar.gz
          generate_release_notes: true
